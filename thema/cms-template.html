    <!-- Hallmark Custom Modern Flat Design System -->
    <style>
        :root {
            --pmb-primary: #0b4d3c;
            --pmb-primary-dark: #073529;
            --pmb-accent: #c89a3b;
            --pmb-accent-hover: #b3862e;
            --pmb-dark: #0f172a;
            --pmb-slate: #1e293b;
            --pmb-muted: #64748b;
            --pmb-light: #f8fafc;
            --pmb-border: #e2e8f0;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            font-family: var(--font-main);
            color: #334155;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
            opacity: 1 !important;
            visibility: visible !important;
        }

        /* Hilangkan semua sisa rounded/radius di wrapper utama */
        *, *::before, *::after {
            border-radius: 0px !important;
        }

        .kingster-page-preload {
            display: none !important;
        }

        h1, h2, h3, h4, h5, h6, .kingster-title-font {
            font-family: var(--font-heading) !important;
            letter-spacing: -0.02em;
        }

        /* Top Bar Global Override (Desktop & Mobile) */
        .kingster-top-bar {
            background-color: var(--pmb-primary) !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }

        .kingster-top-bar-background {
            background-color: var(--pmb-primary) !important;
            display: none !important;
        }

        .kingster-top-bar, .kingster-top-bar a, .kingster-top-bar li {
            color: #ecfdf5 !important;
            font-family: var(--font-main) !important;
        }

        .kingster-top-bar i {
            color: var(--pmb-accent) !important;
        }

        /* Mobile Header & Controls */
        .kingster-mobile-header {
            background: #ffffff !important;
            border-bottom: 1px solid #e2e8f0 !important;
        }

        .kingster-mobile-menu-button {
            color: var(--pmb-dark) !important;
        }

        .kingster-mobile-menu-button span,
        .kingster-mobile-menu-button span::before,
        .kingster-mobile-menu-button span::after {
            background-color: var(--pmb-dark) !important;
        }

        .kingster-main-menu-search {
            color: var(--pmb-dark) !important;
        }

        /* Mobile Slide-out Menu Flat */
        .kingster-mm-menu-wrap {
            background-color: var(--pmb-primary-dark) !important;
            border-left: 3px solid var(--pmb-accent) !important;
        }

        .kingster-mm-menu-wrap ul.m-menu li a {
            color: #ffffff !important;
            font-family: var(--font-heading) !important;
            font-weight: 600 !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            padding: 14px 20px !important;
        }

        .kingster-mm-menu-wrap ul.m-menu li a:hover,
        .kingster-mm-menu-wrap ul.m-menu li.current-menu-item > a {
            color: var(--pmb-accent) !important;
            background-color: rgba(200, 154, 59, 0.1) !important;
        }

        .kingster-mm-menu-wrap ul.m-menu ul.sub-menu {
            background-color: #031c15 !important;
        }

        /* Top Search Popup Flat */
        .kingster-top-search-wrap {
            background: rgba(7, 53, 41, 0.96) !important;
        }

        .kingster-top-search-wrap input.search-field {
            background: #ffffff !important;
            color: #0f172a !important;
            border: 2px solid var(--pmb-accent) !important;
            font-family: var(--font-heading) !important;
        }

        /* Flat Utilities */
        .btn-flat {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-heading);
            font-weight: 600;
            text-decoration: none !important;
            border: none;
            border-radius: 0px !important;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-flat-primary {
            background-color: var(--pmb-primary);
            color: #ffffff !important;
        }

        .btn-flat-primary:hover {
            background-color: var(--pmb-primary-dark);
            color: #ffffff !important;
        }

        .btn-flat-accent {
            background-color: var(--pmb-accent);
            color: #ffffff !important;
        }

        .btn-flat-accent:hover {
            background-color: var(--pmb-accent-hover);
            color: #ffffff !important;
        }

        /* Section Headings */
        .section-header-flat {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-header-flat .badge-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--pmb-primary);
            background: #ecfdf5;
            padding: 4px 14px;
            border: 1px solid #d1fae5;
            margin-bottom: 12px;
        }

        .section-header-flat h2 {
            font-size: 28px;
            font-weight: 800;
            color: var(--pmb-dark);
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .section-header-flat p {
            font-size: 15px;
            color: var(--pmb-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ========================================================
           MODERN FLAT NAVBAR & DROPDOWN MENU SYSTEM
           ======================================================== */
        .kingster-navigation .sf-menu > li > a {
            font-family: var(--font-heading) !important;
            font-size: 14.5px !important;
            font-weight: 600 !important;
            color: #0f172a !important;
            transition: color 0.2s ease !important;
            padding-bottom: 34px !important;
        }

        .kingster-navigation .sf-menu > li > a:hover,
        .kingster-navigation .sf-menu > li.current-menu-item > a,
        .kingster-navigation .sf-menu > li.current-menu-ancestor > a {
            color: #0b4d3c !important;
        }

        /* Remove Kingster Orange Slide-bar */
        .kingster-navigation .kingster-navigation-slide-bar {
            border-color: #0b4d3c !important;
            height: 3px !important;
        }
        .kingster-navigation .kingster-navigation-slide-bar:before {
            border-bottom-color: #0b4d3c !important;
        }

        /* Dropdown Container (Level 1 & Nested Level 2) */
        .sf-menu ul.sub-menu,
        .sf-vertical ul.sub-menu,
        .kingster-navigation .sf-menu > .kingster-normal-menu ul {
            background: #ffffff !important;
            border: 1px solid #e2e8f0 !important;
            border-top: 3px solid #0b4d3c !important;
            border-radius: 0px !important;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.08) !important;
            padding: 6px 0 !important;
            min-width: 280px !important;
            margin-top: 0px !important;
        }

        /* Dropdown List Items */
        .sf-menu > .kingster-normal-menu li,
        .sf-vertical ul.sub-menu li,
        .sf-menu ul.sub-menu li {
            background-color: #ffffff !important;
            border-bottom: 1px solid #f1f5f9 !important;
            padding: 0 !important;
            margin: 0 !important;
            position: relative !important;
            display: block !important;
            width: 100% !important;
        }

        .sf-menu ul.sub-menu li:last-child {
            border-bottom: none !important;
        }

        /* Dropdown Links */
        .sf-menu > li > .sub-menu a,
        .sf-vertical ul.sub-menu li a,
        .sf-menu ul.sub-menu li a {
            font-family: var(--font-heading) !important;
            font-size: 13.5px !important;
            font-weight: 600 !important;
            color: #334155 !important;
            padding: 12px 20px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            background: #ffffff !important;
            border-left: 3px solid transparent !important;
            transition: all 0.2s ease !important;
            text-decoration: none !important;
            line-height: 1.4 !important;
        }

        /* Dropdown Hover State */
        .sf-menu > li > .sub-menu a:hover,
        .sf-menu > li > .sub-menu .current-menu-item > a,
        .sf-menu > li > .sub-menu .current-menu-ancestor > a,
        .sf-menu ul.sub-menu li a:hover,
        .sf-menu ul.sub-menu li:hover > a {
            background-color: #ecfdf5 !important;
            color: #0b4d3c !important;
            border-left-color: #0b4d3c !important;
            padding-left: 24px !important;
        }

        /* Nested Submenu (Level 2 Flyout e.g. "Ekonomi Syariah") */
        .sf-menu ul.sub-menu ul.sub-menu {
            top: -6px !important;
            left: 100% !important;
            border-top: 3px solid #c89a3b !important;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.12) !important;
        }

        .sf-menu ul.sub-menu li.menu-item-has-children > a:after {
            content: "\f105";
            font-family: FontAwesome;
            font-size: 14px;
            color: #94a3b8;
            margin-left: 12px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .sf-menu ul.sub-menu li.menu-item-has-children:hover > a:after {
            color: #0b4d3c;
            transform: translateX(3px);
        }
    </style>
