    <!-- Hallmark Custom Modern Flat Design System -->
    <style>
        :root {
            --pmb-primary: #0b4d3c;
            --pmb-primary-dark: #073529;
            --pmb-accent: #c89a3b;
            --pmb-accent-hover: #b3862e;
            --pmb-dark: #0f172a;
            --pmb-slate: #1e293b;
            --pmb-muted: #64748b;
            --pmb-light: #f8fafc;
            --pmb-border: #e2e8f0;
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            --font-heading: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            font-family: var(--font-main);
            color: #334155;
            background-color: #ffffff;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6, .kingster-title-font {
            font-family: var(--font-heading) !important;
            letter-spacing: -0.02em;
        }

        /* Flat Utilities */
        .btn-flat {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: var(--font-heading);
            font-weight: 600;
            text-decoration: none !important;
            border: none;
            border-radius: 0px !important;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-flat-primary {
            background-color: var(--pmb-primary);
            color: #ffffff !important;
        }

        .btn-flat-primary:hover {
            background-color: var(--pmb-primary-dark);
            color: #ffffff !important;
        }

        .btn-flat-accent {
            background-color: var(--pmb-accent);
            color: #ffffff !important;
        }

        .btn-flat-accent:hover {
            background-color: var(--pmb-accent-hover);
            color: #ffffff !important;
        }

        /* Section Headings */
        .section-header-flat {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-header-flat .badge-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--pmb-primary);
            background: #ecfdf5;
            padding: 4px 14px;
            border: 1px solid #d1fae5;
            margin-bottom: 12px;
        }

        .section-header-flat h2 {
            font-size: 28px;
            font-weight: 800;
            color: var(--pmb-dark);
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .section-header-flat p {
            font-size: 15px;
            color: var(--pmb-muted);
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
